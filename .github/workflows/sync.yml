name: Sync register to dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet openpyxl
      - name: Regenerate ctr-data.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python .github/scripts/sync_register.py
      - name: Commit & push
        run: |
          git config user.name "Akij Sync"
          git config user.email "sync@akijconsulting.com"
          git add ctr-data.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Auto-sync ctr-data.js from register (GitHub Action)"
            git push
          fi
