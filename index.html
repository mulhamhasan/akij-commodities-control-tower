<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akij Commodities — Market Intelligence</title>
<style>
  :root{
    --bg:#0a0f1c; --panel:#101828; --panel2:#0c1424; --border:#1e2a44;
    --text:#e7eefc; --muted:#8ea0bd; --faint:#5c6c8a;
    --accent:#38bdf8; --accent2:#22d3ee;
    --bull:#34d399; --bear:#f87171; --neut:#94a3b8; --warn:#f59e0b;
    --sup:#22c55e; --dem:#38bdf8; --fin:#a78bfa;
    --input:#16213a; --input2:#0e1628; --active:#182a4a;
    --plant:#15803d; --harv:#86efac; --harvtx:#0a0f1c;
    --cardbg:#101828; --cell:#0e1628;
    --gridline:#2c3b5e;
  }
  html[data-theme="light"]{
    --bg:#f3f5fa; --panel:#ffffff; --panel2:#eef1f7; --border:#d9e0ee;
    --text:#1a2233; --muted:#526082; --faint:#8793ad;
    --accent:#0284c7; --accent2:#0e7490;
    --bull:#059669; --bear:#dc2626; --neut:#64748b; --warn:#d97706;
    --sup:#16a34a; --dem:#0284c7; --fin:#7c3aed;
    --input:#e6ecf7; --input2:#eef1f7; --active:#dbe7f6;
    --plant:#16a34a; --harv:#4ade80; --harvtx:#052e16;
    --cardbg:#ffffff; --cell:#f1f4fa;
    --gridline:#c9d3e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .logo{font-weight:800;font-size:15px;letter-spacing:.3px}
  .logo b{color:var(--accent)}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--bull);box-shadow:0 0 8px var(--bull);animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.35}}
  .clock{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .btn{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
  .btn:hover{border-color:var(--accent)}
  .btn:active{background:var(--active)}
  .btn .sp{display:inline-block;transition:transform .6s}
  .btn.spinning .sp{transform:rotate(360deg)}
  .iconbtn{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;width:26px;height:26px;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:border-color .15s}
  .iconbtn:hover{border-color:var(--accent)}
  .lastupd{font-size:10.5px;color:var(--faint)}
  .main{padding:16px 20px;display:flex;flex-direction:column;gap:16px}

  .viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:flex;background:var(--input2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:none;color:var(--muted);padding:9px 16px;font-size:13px;cursor:pointer;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--active);color:var(--accent)}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:10px;text-transform:uppercase;color:var(--faint);letter-spacing:.6px}
  select{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 12px;font-size:14px;min-width:200px}
  select:focus{outline:none;border-color:var(--accent)}
  .spacer{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{background:var(--input);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
  .pill b{color:var(--accent2)}

  .row{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.3fr 1fr}
  @media(max-width:1100px){.g4,.g3,.g2{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
  .card{background:var(--cardbg);border:1px solid var(--border);border-radius:12px;padding:16px}
  .h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .h .t{font-weight:700;font-size:14px}
  .h .sub{color:var(--faint);font-size:11px;margin-left:auto}
  .h .ic{font-size:16px}

  .idx{display:flex;flex-direction:column;gap:12px}
  .idx .card{padding:13px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
  .idx .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .idx .nm{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .idx .val{font-size:22px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
  .idx .val small{font-size:12px;font-weight:500;color:var(--muted)}
  .idx .foot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px}
  .up{color:var(--bull)} .dn{color:var(--bear)} .fl{color:var(--neut)}
  .src{color:var(--faint);font-size:10px;display:inline-flex;align-items:center;gap:4px;margin-left:auto}

  .risk{display:flex;flex-direction:column;gap:9px}
  .risk .r{display:grid;grid-template-columns:1fr 90px 60px;gap:10px;align-items:center;font-size:12.5px}
  .risk .r .nm{color:var(--text)}
  .risk .r .lv{text-align:right;font-weight:700;font-size:11px}
  .lv.high{color:var(--bear)} .lv.mod{color:var(--warn)} .lv.low{color:var(--bull)}
  .risk .bar{height:7px;background:var(--input);border-radius:4px;overflow:hidden}
  .risk .bar i{display:block;height:100%;border-radius:4px}

  .flow{display:flex;flex-direction:column;gap:10px}
  .flow .f{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel2)}
  .flow .f .top{display:flex;align-items:center;gap:8px}
  .flow .f .cm{font-weight:700;font-size:13px}
  .flow .f .dir{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px}
  .dir.in{background:#14351f;color:var(--bull)} .dir.out{background:#3a3120;color:var(--warn)}
  .flow .f .cnt{margin-top:6px;font-size:12px;color:var(--muted)}

  .port{display:flex;flex-direction:column;gap:10px}
  .port .p{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel2)}
  .port .p .nm{font-weight:700;flex:1}
  .port .p .qt{font-size:12px;color:var(--muted)}
  .port .p .st{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
  .st.ok{background:#14351f;color:var(--bull)} .st.warn{background:#3a3120;color:var(--warn)} .st.crit{background:#3a1f27;color:var(--bear)}

  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--border);background:var(--input2);color:var(--muted);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--active)}
  .tabs button .cnt{background:var(--input);color:var(--accent2);border-radius:10px;padding:0 7px;font-size:11px}
  .grp{margin-bottom:16px}
  .grp .gname{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin:0 0 7px 2px}
  .items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:700px){.items{grid-template-columns:1fr}}
  .item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel2);cursor:pointer;text-decoration:none;color:var(--text);transition:border-color .15s}
  .item:hover{border-color:var(--accent)}
  .item .it{flex:1;font-size:13px}
  .item .tl{font-size:10.5px;color:var(--faint);white-space:nowrap}
  .item .ext{color:var(--faint);font-size:12px}
  .item.nolink{opacity:.55;cursor:default}
  .item .side-tag{width:3px;align-self:stretch;border-radius:3px}
  .side-tag.supply{background:var(--sup)} .side-tag.demand{background:var(--dem)} .side-tag.finance{background:var(--fin)}

  .note{color:var(--faint);font-size:11px;padding:2px 0}
  .empty{color:var(--faint);padding:30px;text-align:center}
  a.item{display:flex}

  .dm-banner{border:1px solid #3a3120;background:linear-gradient(135deg,#1a1408,#241a08);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  html[data-theme="light"] .dm-banner{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d}
  .dm-banner .tag{display:inline-block;background:#3a3120;color:var(--warn);font-weight:800;font-size:11px;letter-spacing:1px;padding:2px 10px;border-radius:10px;margin-bottom:6px}
  html[data-theme="light"] .dm-banner .tag{background:#fde68a}
  .dm-banner .read{font-size:14px;line-height:1.6;color:#f3e6c8}
  html[data-theme="light"] .dm-banner .read{color:#78350f}
  .dm-banner .read b{color:var(--warn)}
  .dm-wrap{overflow-x:auto}
  .dm-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px}
  .dm-table th{color:var(--faint);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;letter-spacing:.5px;white-space:nowrap}
  .dm-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .dm-table td.cm{font-weight:700;font-size:13px;white-space:nowrap}
  .sig{display:inline-block;font-weight:800;font-size:13px;margin-right:5px}
  .sig.bull{color:var(--bull)} .sig.bear{color:var(--bear)} .sig.neut{color:var(--neut)}
  .factor-txt{color:var(--muted);font-size:11.5px}
  .fobval{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .rec{display:inline-block;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:8px;white-space:nowrap}
  .rec.buy{background:#14351f;color:var(--bull)}
  .rec.partial{background:#3a3120;color:var(--warn)}
  .rec.hold{background:#24304a;color:var(--neut)}
  .rec.defer{background:#1c2436;color:var(--faint)}
  .conv{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10px;color:var(--faint)}
  .conv i{height:5px;border-radius:3px;background:#233355}
  .dm-comment{margin-top:16px}
  .dm-comment .box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel2);margin-bottom:10px}
  .dm-comment .cm-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .dm-comment .cm-name{font-weight:700;font-size:14px}
  .dm-comment .cm-txt{color:var(--muted);font-size:12.5px;line-height:1.6}
  .dm-comment .cm-txt b{color:var(--text)}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}

  /* Crop calendar — clearer visualization */
  .cc-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel2)}
  .cc-table{border-collapse:collapse;width:100%;font-size:11px;min-width:760px}
  .cc-table th{color:var(--muted);font-weight:700;padding:6px 4px;border:1px solid var(--gridline);text-align:center;text-transform:uppercase;font-size:10px;letter-spacing:.4px;position:sticky;top:0;background:var(--panel2);z-index:1}
  .cc-table th:first-child{text-align:left;position:sticky;left:0;z-index:3;min-width:110px}
  .cc-table th.cur{color:var(--accent2)}
  .cc-table td{padding:0}
  .cc-table td.cn{position:sticky;left:0;background:var(--panel2);padding:6px 10px;font-weight:700;white-space:nowrap;border:1px solid var(--gridline);z-index:2;font-size:11.5px}
  .cc-table td.cn small{display:inline;color:var(--faint);font-weight:400}
  .cc-cell{height:24px;min-width:34px;text-align:center;border:1px solid var(--gridline);font-weight:800;font-size:11px;transition:transform .1s}
  .cc-cell:hover{transform:scale(1.12);z-index:5;box-shadow:0 0 0 2px var(--accent2)}
  .cc-cell.plant{background:var(--plant);color:#eafff1}
  .cc-cell.harv{background:var(--harv);color:var(--harvtx)}
  .cc-cell.other{background:#3a3120;color:var(--warn)}
  .cc-cell.cur{outline:2px solid var(--accent2);outline-offset:-2px}
  .cc-cell.glyph{font-size:11px}
  .cc-legend{display:flex;gap:20px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:12px}
  .sw{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:6px;font-weight:800;font-size:11px}
  .sw.plant{background:var(--plant);color:#eafff1}
  .sw.harv{background:var(--harv);color:var(--harvtx)}
  .sw.inact{background:var(--cell);border:1px solid var(--border)}

  .ana-table{width:100%;border-collapse:collapse;font-size:12px}
  .ana-table th{color:var(--faint);text-align:left;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;letter-spacing:.4px}
  .ana-table td{padding:8px;border-bottom:1px solid var(--border)}
  .stat{display:inline-block;font-weight:700;font-size:11px;padding:2px 9px;border-radius:9px}
  .stat.harvesting{background:#14351f;color:var(--harv)}
  .stat.planting{background:#0c2f1d;color:#4ade80}
  .stat.inactive{background:#1c2436;color:var(--faint)}
  .rule-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:#3a3120;color:var(--warn)}
  .cst{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:9px;white-space:nowrap}
  .cst-transit{background:#12233d;color:var(--accent2)}
  .cst-done{background:#14351f;color:var(--bull)}
  .cst-bad{background:#3a1f27;color:var(--bear)}
  .cst-neut{background:#1c2436;color:var(--faint)}

  .news{display:flex;flex-direction:column;gap:10px}
  .news .n{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel2)}
  .news .n .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .news .n .t{font-weight:700;font-size:13.5px}
  .news .n .d{color:var(--faint);font-size:11px}
  .news .n .cm-tag{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--active);color:var(--accent)}
  .news .n .risk{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
  .risk.high{background:#3a1f27;color:var(--bear)} .risk.moderate{background:#3a3120;color:var(--warn)} .risk.low{background:#14351f;color:var(--bull)}
  .news .n .imp{margin-top:7px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .n-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:9px}
  @media(max-width:700px){.n-grid{grid-template-columns:1fr}}
  .n-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:3px;font-weight:700}
  .n-txt{font-size:12.5px;color:var(--muted);line-height:1.55}
  .n-sol{margin-top:10px;font-size:12.5px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;line-height:1.55}
  .n-sol b{color:var(--accent2)}

  /* Insights */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--cardbg);border:1px solid var(--border);border-radius:12px;padding:14px}
  .kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .kpi .v{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:11px;color:var(--faint);margin-top:3px}
  .heat-cell{text-align:center;font-weight:700;border-radius:6px;padding:6px 2px;font-size:12px;min-width:40px}
  .heat-cell.g{background:#14351f;color:var(--bull)}
  .heat-cell.a{background:#3a3120;color:var(--warn)}
  .heat-cell.r{background:#3a1f27;color:var(--bear)}
  .insight-line{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);line-height:1.55}
  .insight-line:last-child{border-bottom:none}
  .insight-line b{color:var(--text)}
  .insight-line .dot{color:var(--accent2);font-weight:800;flex-shrink:0}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;margin:2px 2px 0 0}
  .chip.buy{background:#14351f;color:var(--bull)} .chip.plant{background:#0c2f1d;color:#4ade80} .chip.gap{background:#3a1f27;color:var(--bear)}
  .chip.end{background:var(--active);color:var(--accent)}
  .chip.old{background:var(--input);color:var(--faint)}
  .hc-g{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .hc-g:last-child{border-bottom:none}
  .hc-h{font-weight:700;min-width:168px;color:var(--text);font-size:12px;flex-shrink:0}
  .hc-h small{display:block;color:var(--faint);font-weight:400;font-size:10px}
  .hc-list{flex:1;line-height:2}
  .chartbox{position:relative;height:300px}
  .chartbox.tall{height:340px}
  .chartbox.short{height:220px}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">AKIJ COMMODITIES <b>MARKET INTELLIGENCE</b></div>
    <span class="clock" id="clock">—</span>
    <button class="btn" id="refreshBtn" title="Re-pull latest register data"><span class="sp">↻</span> Refresh</button>
    <button class="iconbtn" id="themeBtn" title="Toggle dark / light mode"><span id="themeIcon">🌙</span></button>
    <span class="lastupd" id="lastupd">—</span>
  </div>

  <div class="main">
    <div class="viewbar">
      <div class="seg" id="seg">
        <button class="on" data-view="macro">Macro</button>
        <button data-view="dive">Deep Dive</button>
        <button data-view="decision">Decision Matrix</button>
        <button data-view="news">News &amp; Impact</button>
      </div>
      <div class="field" id="commodityField">
        <label>Crop</label>
        <select id="commodity"></select>
      </div>
      <div class="field" id="reportTypeField">
        <label>Report Type</label>
        <select id="reportType"></select>
      </div>
      <div class="field" id="meetingField">
        <label>Meeting</label>
        <select id="meeting"></select>
      </div>
      <div class="spacer">
        <span class="pill">Source register <b id="nItems">—</b></span>
        <span class="pill">Latest meeting <b id="meetingPill">—</b></span>
      </div>
    </div>

    <div id="macro" style="display:none"></div>
    <div id="dive" style="display:none"></div>
    <div id="decision" style="display:none"></div>
    <div id="crop" style="display:none"></div>
    <div id="news" style="display:none"></div>

    <div class="note">Every metric below links to the live analysis document in the ARL/ACL "Source File" register (Supply / Demand / Finance chapters). Click <b>↻ Refresh</b> to pull the latest register snapshot.</div>
  </div>
</div>

<script src="ctr-crop.js"></script>
<script src="ctr-consignment.js"></script>
<script>
const MACRO = {
  energy: [
    {nm:"World Bunker Price — LSFO", val:"est.", unit:"USD/mt", d:"Strait of Hormuz reopening — easing", c:"dn",
     link:"https://docs.google.com/spreadsheets/d/1cRvhPMI7KWDjQSoB6qdN3uVkWqNzQVvmphqQqRQBC08/edit?gid=130214077"},
    {nm:"World Bunker Price — MGO", val:"est.", unit:"USD/mt", d:"watch Brent crude days-wise", c:"fl",
     link:"https://docs.google.com/spreadsheets/d/1cRvhPMI7KWDjQSoB6qdN3uVkWqNzQVvmphqQqRQBC08/edit?gid=130214077"},

/* ---------- INSIGHTS (analysis layer) ---------- */
function computeInsights(){
  const d = window.CTR_DATA;
  const coms = Object.keys(d);
  let total=0, withLink=0, financeCom=0, supplyCom=0, demandCom=0;
  const noLink=[];
  const per={};
  coms.forEach(c=>{
    const dd=d[c];
    per[c]={supply:dd.supply.length, demand:dd.demand.length, finance:dd.finance.length, noLink:0};
    ['supply','demand','finance'].forEach(s=>{
      (dd[s]||[]).forEach(it=>{ total++; if(it.link){withLink++;} else {noLink.push({com:c,side:s,item:it.item}); per[c].noLink++;} });
    });
    if(dd.finance.length>0) financeCom++;
    if(dd.supply.length>0) supplyCom++;
    if(dd.demand.length>0) demandCom++;
  });
  const noFinance = coms.filter(c=>(d[c].finance||[]).length===0);
  const noSupply = coms.filter(c=>(d[c].supply||[]).length===0);
  const noDemand = coms.filter(c=>(d[c].demand||[]).length===0);
  return {coms, total, withLink, missing:noLink.length, noLink, financeCom, supplyCom, demandCom, noFinance, noSupply, noDemand, per};
}

  const el = document.getElementById(canvasId);

}

/* ---------- UPCOMING CONSIGNMENT (table like the Excel) ---------- */
const CONS_KEYS = ['vessel','origin','qty','eta','seller','status','destination','port'];
const CONS_LABELS = { vessel:'Vessel', origin:'Origin', qty:'Qty (MT)', eta:'ETA', seller:'Seller / Buyer', status:'Status', destination:'Destination', port:'Load Port' };
function consignmentSource(){
  const d = window.CTR_DATA[state.commodity] || {supply:[],demand:[],finance:[]};
  for (const side of ['supply','demand','finance']) {
    for (const i of (d[side]||[])) {
      if ((i.group||'').toLowerCase().indexOf('consign') !== -1) return i;
    }
  }
  return null;
}
function consStatusTag(s){
  const t = (s||'').toLowerCase();
  let cls = 'cst-neut';
  if (t.indexOf('transit') !== -1) cls = 'cst-transit';
  else if (t.indexOf('discharg') !== -1 || t.indexOf('arrived') !== -1) cls = 'cst-done';
  else if (t.indexOf('cancel') !== -1 || t.indexOf('delay') !== -1) cls = 'cst-bad';
  return s ? `<span class="cst ${cls}">${esc(s)}</span>` : '—';
}
function renderConsignment(){
  const rows = (window.CONSIGNMENTS && window.CONSIGNMENTS[state.commodity]) || [];
  const src = consignmentSource();
  const present = CONS_KEYS.filter(k => rows.some(r => r[k]));
  const head = present.map(k=>`<th>${CONS_LABELS[k]}</th>`).join('');
  const body = rows.map(r=>{
    const cells = present.map(k=>{
      const v = r[k];
      if (k === 'status') return `<td>${consStatusTag(v)}</td>`;
      if (k === 'vessel') return `<td class="cm">${v ? esc(v) : '—'}</td>`;
      if (k === 'qty') return `<td class="fobval">${v ? Number(String(v).replace(/[^0-9.]/g,'')).toLocaleString('en-US',{maximumFractionDigits:1}) : '—'}</td>`;
      return `<td>${v ? esc(v) : '—'}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  const total = rows.reduce((a,r)=>a + (parseFloat(String(r.qty||'').replace(/[^0-9.]/g,''))||0), 0);

  $('dive').innerHTML = `
    <div class="card"><div class="h"><span class="ic">🚢</span><span class="t">Upcoming Consignment — ${esc(state.commodity)}</span><span class="sub">${rows.length} lines · ${total>0? total.toLocaleString('en-US',{maximumFractionDigits:0})+' MT total':''}</span></div>
      ${rows.length
        ? `<div class="dm-wrap"><table class="dm-table" style="min-width:560px"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
           <div class="note" style="margin-top:10px">${src ? `Source: <a href="${src.link}" target="_blank" style="color:var(--accent2)">${esc(src.item)} ↗</a>` : ''} · as of ${decisionDate()}</div>`
        : `<div class="empty">No upcoming consignment data for ${esc(state.commodity)}.${src ? ` <a href="${src.link}" target="_blank" style="color:var(--accent2)">Open source sheet ↗</a>` : ''}</div>`}
    </div>`;
}
function renderDive(){
  renderCommodity();
  if (state.reportType === 'consignment') { renderConsignment(); return; }
  const d = window.CTR_DATA[state.commodity] || {supply:[],demand:[],finance:[]};

  const rt = REPORT_TYPES.find(r=>r.key===state.reportType);
  if (rt && rt.group) {
    const matches = [];
    Object.keys(SIDE_META).forEach(s=>{
      (d[s]||[]).forEach(i=>{ if(i.group===rt.group) matches.push({meta:SIDE_META[s], i}); });
    });
    const list = matches.map(m=>{
      const href = meetingLink(m.i);
      return href
        ? `<a class="item" href="${href}" target="_blank"><span class="side-tag ${m.meta.tag}"></span><span class="it">${esc(m.i.item)}</span><span class="tl">${esc(m.meta.label)} · ${esc(m.i.timeline)}</span><span class="ext">↗</span></a>`
        : `<div class="item nolink"><span class="side-tag ${m.meta.tag}"></span><span class="it">${esc(m.i.item)}</span><span class="tl">${esc(m.meta.label)} · ${esc(m.i.timeline)}</span><span class="ext">no link</span></div>`;
    }).join('');
    $('dive').innerHTML = list
      ? `<div class="grp"><div class="gname">${rt.label} — ${state.commodity}</div><div class="items">${list}</div></div>`
      : `<div class="empty">No "${rt.label}" reports for ${state.commodity}.</div>`;
    return;
  }

  const tabs = Object.keys(SIDE_META).map(s=>{
    const meta=SIDE_META[s]; const n=(d[s]||[]).length;
    return `<button class="${state.side===s?'on':''}" data-side="${s}">${meta.ic} ${meta.label} <span class="cnt">${n}</span></button>`;
  }).join('');
  const items = (d[state.side]||[]);
  const groups={};
  items.forEach(i=>{ (groups[i.group]=groups[i.group]||[]).push(i); });
  const body = Object.keys(groups).length===0
    ? `<div class="empty">No ${SIDE_META[state.side].label} reports for ${state.commodity}.</div>`
    : Object.entries(groups).map(([g,arr])=>`<div class="grp"><div class="gname">${g}</div><div class="items">
        ${arr.map(i=> meetingLink(i)
          ? `<a class="item" href="${meetingLink(i)}" target="_blank"><span class="side-tag ${SIDE_META[state.side].tag}"></span><span class="it">${esc(i.item)}</span><span class="tl">${esc(i.timeline)}</span><span class="ext">↗</span></a>`
          : `<div class="item nolink"><span class="side-tag ${SIDE_META[state.side].tag}"></span><span class="it">${esc(i.item)}</span><span class="tl">${esc(i.timeline)}</span><span class="ext">no link</span></div>`
        ).join('')}
      </div></div>`).join('');
  $('dive').innerHTML = `<div class="tabs">${tabs}</div>${body}`;
}

/* ---------- CROP CALENDAR & SOURCING ---------- */
function currentMonthInfo(){
  const d = new Date();
  const idx = d.getMonth();
  return { idx, name: MONTHS[idx], full: d.toLocaleString('en',{month:'long', year:'numeric'}) };
}
function countryAnalytics(phases, curIdx){
  const cur = phases[MONTHS[curIdx]] || 'inactive';
  let rem = 0;
  if (cur === 'harvesting') {
    for (let i=0;i<12;i++){ const k=(curIdx+i)%12; if(phases[MONTHS[k]]==='harvesting') rem++; else break; }
  }
  let until = null;
  for (let i=1;i<=12;i++){ const k=(curIdx+i)%12; if(phases[MONTHS[k]]==='harvesting'){ until=i; break; } }
  const prev = phases[MONTHS[(curIdx+11)%12]] || 'inactive';
  const startedThisMonth = cur==='harvesting' && prev!=='harvesting';
  const status = cur==='planting' ? 'Planting' : cur==='harvesting' ? 'Harvesting' : 'Inactive';
  return { status, cur, rem, until, startedThisMonth };
}
function ccClass(ph){ return ph==='planting'?'plant':ph==='harvesting'?'harv':(ph==='inactive'||ph==='')?'':'other'; }
function ccGlyph(ph){
  if (ph==='planting') return 'P';
  if (ph==='harvesting') return 'H';
  if (ph==='storage') return 'S';
  if (ph==='funding') return 'F';
  if (ph==='selling') return '$';
  if (ph==='collection') return 'C';
  return '';
}

/* Recent harvest completions — how long ago each origin's harvest ended */
function harvestCompletions(){
  const C = window.CROP_DATA;
  const cur = currentMonthInfo();
  const items = [];
  Object.entries(C.calendars).forEach(([com, cal])=>{
    (cal||[]).forEach(c=>{
      const ph = c.m;
      const curPhase = ph[cur.name] || 'inactive';
      if (curPhase === 'harvesting') {
        let rem = 0;
        for (let i=0;i<12;i++){ const k=(cur.idx+i)%12; if(ph[MONTHS[k]]==='harvesting') rem++; else break; }
        items.push({ com, country:c.country, season:c.season, type:'ending', m: rem-1 }); // m=0 → ends this month
      } else {
        let ago = null;
        for (let i=1;i<=12;i++){ const k=(((cur.idx-i)%12)+12)%12; if(ph[MONTHS[k]]==='harvesting'){ ago=i; break; } }
        if (ago !== null) items.push({ com, country:c.country, season:c.season, type:'ended', m: ago });
      }
    });
  });
  return items;
}
function harvestCompletionHtml(){
  const C = window.CROP_DATA;
  const coms = Object.keys(C.calendars||{});
  const rows = coms.map(com=>{
    const origins = originsByFreshness(com).slice(0,7);
    const chips = origins.map(o=>`<span class="chip ${o.months===0?'buy':o.months<=2?'end':'old'}" title="${esc(com)} · ${esc(o.country)}">${esc(o.country)} · ${o.months===0?'now':o.months+'mo ago'}</span>`).join('');
    return `<div class="hc-g"><div class="hc-h">${esc(com)}<small>top ${origins.length}</small></div><div class="hc-list">${chips || '<span style="color:var(--faint)">—</span>'}</div></div>`;
  }).join('');
  return `

      ${rows}

    </div>`;
}

/* Harvest freshness rule for procurement recommendation:
   Argentina -> suggest if harvest ended within 6 months; others -> within 4 months. */
function harvestFreshness(c){
  const cur = currentMonthInfo();
  const ph = c.m;
  const curPhase = ph[cur.name] || 'inactive';
  if (curPhase === 'harvesting') return 0;
  for (let i=1;i<=12;i++){
    const k=(((cur.idx-i)%12)+12)%12;
    if (ph[MONTHS[k]]==='harvesting') return i;
  }
  return null;
}
function recommendedOrigins(com){
  const cal = (window.CROP_DATA.calendars||{})[com];
  if (!cal) return [];
  const seen = new Set();
  const out = [];
  cal.forEach(c=>{
    const f = harvestFreshness(c);
    if (f === null) return;
    const isArg = (c.country||'').toLowerCase().indexOf('argentina') !== -1;
    const th = isArg ? 6 : 4;
    if (f <= th && !seen.has(c.country)) { seen.add(c.country); out.push({country:c.country, months:f, arg:isArg}); }
  });
  out.sort((a,b)=>a.months-b.months);
  return out;
}
function originsByFreshness(com){
  const cal = (window.CROP_DATA.calendars||{})[com];
  if (!cal) return [];
  const seen = new Set();
  const out = [];
  cal.forEach(c=>{
    const f = harvestFreshness(c);
    if (f === null || seen.has(c.country)) return;
    seen.add(c.country);
    out.push({country:c.country, months:f});
  });
  out.sort((a,b)=>a.months-b.months);
  return out;
}
function procurementHtml(){
  const C = window.CROP_DATA;

    const chips = top.length

      : '<span style="color:var(--faint)">— none fresh</span>';
    return `<div class="hc-g"><div class="hc-h">${esc(com)}<small>top ${top.length}${recs.length>7?' of '+recs.length:''}</small></div><div class="hc-list">${chips}</div></div>`;
  }).join('');
  return `
    <div class="card"><div class="h"><span class="ic">🛒</span><span class="t">Procurement Recommendation</span><span class="sub">top 7 · harvest-freshness rule</span></div>
      ${rows}

    </div>`;
}

async function refreshAll(){
  const btn = $('refreshBtn');
  btn.classList.add('spinning');
  try {
    const [ctrOk, crop, cons] = await Promise.all([loadCtrData(), loadScript('ctr-crop.js'), loadScript('ctr-consignment.js')]);
    window.CROP_DATA = crop;
    window.CONSIGNMENTS = cons;
    renderMeetings();
    render();
    $('lastupd').textContent = 'refreshed ' + new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Dhaka',hour12:false});
  } catch(e) {
    $('lastupd').textContent = 'refresh failed — ' + e.message;
  } finally {
    btn.classList.remove('spinning');
  }
}

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if (t==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  $('themeIcon').textContent = t==='light' ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';
  const next = cur==='light' ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  if (state.view==='insights') render(); // re-color charts
}

/* ---------- orchestration ---------- */
function render(){
  const v = state.view;
  $('seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  $('macro').style.display = v==="macro"?"":"none";
  $('dive').style.display = v==="dive"?"":"none";
  $('decision').style.display = v==="decision"?"":"none";
  $('crop').style.display = v==="crop"?"":"none";
  $('news').style.display = v==="news"?"":"none";
  $('commodityField').style.display = "";
  $('reportTypeField').style.display = "";
  renderCommodity();
  renderReportType();
  $('nItems').textContent = Object.keys(window.CTR_DATA).length + " commodities";
  if(v==="macro") renderMacro();
  else if(v==="dive") renderDive();
  else if(v==="decision") renderDecision();
  else if(v==="crop") renderCrop();
  else if(v==="news") renderNews();
}

$('seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; state.view=b.dataset.view; if(state.view!=="crop" && state.reportType==="crop") state.reportType="all"; render(); });
$('commodity').addEventListener('change',e=>{ state.commodity=e.target.value; render(); });
$('reportType').addEventListener('change',e=>{ state.reportType=e.target.value; state.view = state.reportType==="crop" ? "crop" : "dive"; render(); });
$('dive').addEventListener('click',e=>{ const b=e.target.closest('button[data-side]'); if(!b)return; state.side=b.dataset.side; renderDive(); });
$('meeting').addEventListener('change',e=>{ state.meeting=parseInt(e.target.value,10); render(); });
$('refreshBtn').addEventListener('click', refreshAll);
$('themeBtn').addEventListener('click', toggleTheme);

function tick(){ const d=new Date(); $('clock').textContent = d.toLocaleString('en-GB',{timeZone:'Asia/Dhaka',hour12:false}); }
setInterval(tick,1000); tick();

/* silent auto-refresh: poll ctr-data (live API), re-render only when it changes */
let lastCtrText = null;
async function autoRefresh(){
  try {
    const txt = await fetchCtrText();
    if (txt === null) return;
    if (lastCtrText === null) { lastCtrText = txt; return; }
    if (txt !== lastCtrText) { lastCtrText = txt; await refreshAll(); }
  } catch(e){}
}
setInterval(autoRefresh, 120000);

let savedTheme='dark';
try{ savedTheme = localStorage.getItem('theme') || 'dark'; }catch(e){}
applyTheme(savedTheme);
(async function init(){
  await loadCtrData();
  renderMeetings();
  render();
  $('lastupd').textContent = 'loaded ' + new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Dhaka',hour12:false});
})();
</script>
</body>
